name: Build Noah & Bella APK

on:
  push:
    branches:
      - claude/mobile-english-game-kids-40ik0y
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle execute permission
        run: chmod +x NoahBellaEnglish/gradlew 2>/dev/null || true

      - name: Generate Gradle wrapper
        working-directory: NoahBellaEnglish
        run: gradle wrapper --gradle-version 8.2

      - name: Build Debug APK
        working-directory: NoahBellaEnglish
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoahBella-English-Game-DEBUG
          path: NoahBellaEnglish/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show APK info
        run: |
          APK=NoahBellaEnglish/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "✅ APK built successfully!"
            ls -lh "$APK"
          else
            echo "❌ APK not found"
          fi
