name: Build Noah & Bella APK

on:
  push:
    branches:
      - claude/mobile-english-game-kids-40ik0y
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_SDK_ROOT/licenses
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55' \
            > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' \
            > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license

      - name: Install required SDK platform & build-tools
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$SDKM" ] || SDKM="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          echo "sdk manager: $SDKM"
          $SDKM "platforms;android-34" "build-tools;34.0.0" 2>&1

      - name: Download Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-install
          echo "/tmp/gradle-install/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Generate Gradle wrapper
        working-directory: NoahBellaEnglish
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: NoahBellaEnglish
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NoahBella-English-Game-DEBUG
          path: NoahBellaEnglish/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: APK info
        run: |
          APK=NoahBellaEnglish/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "✅ APK built successfully!"
            ls -lh "$APK"
          else
            echo "❌ APK not found"
            find NoahBellaEnglish/app/build -name "*.apk" 2>/dev/null || true
          fi
